.fold.opening .fc2{transform:translateY(-12%) scale(1.07)}

.lbs{width:100%;display:grid;place-items:center;perspective:1200px}
.sl{display:grid;place-items:center}
.sl.sn{animation:pgn .55s cubic-bezier(.2,.8,.2,1) both}
.sl.sp{animation:pgp .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes pgn{from{transform:rotateY(62deg) translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pgp{from{transform:rotateY(-62deg) translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.lbh{width:min(440px,92vw)}.lbh>*{margin:0!important}
.lbtx{display:grid;place-items:center;width:54px;height:54px;border-radius:8px;background:#12402f;color:#c7f45b;font-weight:800}

/* menu bawah, video, rapikan hero */
.navlinks{display:none}
html{scroll-padding-top:6px}
body{padding-bottom:84px}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;width:min(calc(100% - 20px),640px);display:flex;gap:4px;overflow-x:auto;padding:6px;border-radius:999px;background:rgba(7,28,19,.84);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(199,244,91,.28);box-shadow:0 14px 40px rgba(0,0,0,.5);scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dock a{flex:1 0 auto;text-align:center;white-space:nowrap;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:700;color:#cfe6d8;text-decoration:none;transition:background .2s,color .2s}
.dock a:hover{color:#c7f45b}
.dock a.dk{border:1px solid rgba(199,244,91,.4);color:#c7f45b}
.dock a.on,.dock a.dk.on{background:#c7f45b;color:#0b2a1e}

  +'<div class="esec">Info umum</div><div class="editor-grid"><label>Nama brand'+inp('brand',S.brand)+'</label><label>Nomor WhatsApp (admin atau pribadi)'+inp('wa',S.wa)+'</label><label class="chk" style="grid-column:1/-1"><input type="checkbox" data-k="waOn"'+(S.waOn!==false?' checked':'')+'> Tampilkan tombol WhatsApp di website (hilangkan centang untuk menyembunyikan sementara, nomor tetap tersimpan)</label><label>Instagram (tanpa @)'+inp('ig',S.ig)+'</label><label>Tagline'+inp('tagline',S.tagline)+'</label><label>Judul bagian kontak'+inp('ctaT',S.ctaT)+'</label><label>Subjudul kontak'+inp('ctaS',S.ctaS)+'</label><label style="grid-column:1/-1">Baris identitas'+inp('line',S.line)+'</label><label style="grid-column:1/-1">Alamat website (dipakai untuk link review)'+inp('site',S.site)+'</label></div>'

  +'<div class="esec">Paket</div>'+S.pkgs.map((p,i)=>'<div class="ebox">'+inp('pkgs.'+i+'.n',p.n)+inp('pkgs.'+i+'.inc',p.inc)+'<div class="erow">'+inp('pkgs.'+i+'.p',p.p,'n')+'<button class="x" data-a="dp" data-i="'+i+'">Hapus paket</button></div></div>').join('')+'<button class="btn btn-ghost sm" data-a="ap">+ Paket</button>'
  +'<div class="esec">Portofolio dan produk</div><label class="chk"><input type="checkbox" data-k="sample"'+(S.sample!==false?' checked':'')+'> Tampilkan contoh karya selama portofolio masih kosong</label><label class="chk"><input type="checkbox" data-k="products"'+(S.products!==false?' checked':'')+'> Tampilkan etalase produk digital (segera hadir)</label>'+S.works.map((w,i)=>'<div class="ebox"><div class="erow"><div style="flex:1;display:grid;gap:6px">'+inp('works.'+i+'.title',w.title)+inp('works.'+i+'.cat',w.cat,'','Kategori, mis. Social Media')+'</div><button class="x" data-a="dw" data-i="'+i+'">Hapus karya</button></div><div class="ethumbs">'+wimgs(w).map((u,k)=>'<span class="et"><img class="ethumb" src="'+u+'" alt="">'+(k===0?'<em>Sampul</em>':'<button class="x cv" data-a="cov" data-i="'+i+'" data-n="'+k+'" aria-label="Jadikan sampul">★</button>')+'<button class="x" data-a="dwi" data-i="'+i+'" data-n="'+k+'" aria-label="Hapus foto">×</button></span>').join('')+'<label class="btn btn-ghost sm" style="cursor:pointer">+ Foto<input type="file" class="wfa" data-wi="'+i+'" accept="image/*" multiple hidden></label></div><div class="ethumbs">'+wvids(w).map((u,k)=>'<span class="evid">🎬 Video '+(k+1)+' · '+(u.length*0.75/1048576).toFixed(1)+' MB<button class="x" data-a="dvv" data-i="'+i+'" data-n="'+k+'" aria-label="Hapus video">×</button></span>').join('')+'<label class="btn btn-ghost sm" style="cursor:pointer">+ Video<input type="file" class="wfv" data-wi="'+i+'" accept="video/mp4,video/webm,video/quicktime" hidden></label></div>'+inp('works.'+i+'.vurl',w.vurl,'','Link video (YouTube, Instagram, Drive), opsional')+'</div>').join('')+'<button class="btn btn-ghost sm" data-a="aw">+ Karya video (tanpa foto)</button><label class="btn btn-ghost sm" style="cursor:pointer">+ Tambah karya baru (foto)<input type="file" id="wf" accept="image/*" multiple hidden></label><p class="editor-note">Karya dengan kategori yang sama masuk ke satu folder. Maksimal 12 karya, 8 foto per karya. Foto pertama jadi sampul; ketuk ★ untuk menjadikan foto lain sebagai sampul. Ukuran data halaman sekarang sekitar '+mb+' MB (batas halaman di claude.ai sekitar 16 MB).'+(mb>12?' Hampir penuh, kurangi foto atau video.':'')+'</p><p class="editor-note" id="vnote">Video yang diunggah maksimal 6 MB dan 2 per karya (pakai MP4 pendek, resolusi 720p). Untuk video panjang, pakai kolom link video.</p>'
  +'<div class="esec">Alur kerja (How We Work)</div>'+(S.steps||[]).map((s,i)=>'<div class="ebox">'+inp('steps.'+i+'.t',s.t)+inp('steps.'+i+'.d',s.d)+'</div>').join('')+'<div class="esec">Testimoni pelanggan</div><p class="editor-note">Salin pesan ini dan kirim ke pelanggan setelah desain disetujui. Review mereka masuk ke WhatsApp-mu, lalu kamu pilih mana yang ditampilkan.</p><textarea readonly rows="7" onclick="this.select()">'+esc(revMsg())+'</textarea><div class="esec" style="margin-top:14px">Tambah testimoni</div><textarea id="pr" rows="4" placeholder="Tempel pesan review dari WhatsApp di sini"></textarea><button class="btn btn-ghost sm" data-a="pr">+ Tambah dari pesan WhatsApp</button><p class="editor-note" id="prn"></p>'+(S.testi||[]).map((t,i)=>'<div class="ebox">'+inp('testi.'+i+'.name',t.name,'','Nama pelanggan')+inp('testi.'+i+'.biz',t.biz,'','Layanan yang dipakai')+'<label class="chk"><input type="checkbox" data-k="testi.'+i+'.v"'+(t.v?' checked':'')+'> Terverifikasi (pesanan nyata)</label>'+'<textarea data-k="testi.'+i+'.text" placeholder="Isi testimoni">'+esc(t.text)+'</textarea><div class="erow"><input type="number" min="1" max="5" step="1" data-k="testi.'+i+'.r" value="'+(t.r||5)+'" aria-label="Bintang 1 sampai 5"><span class="editor-note" style="margin:0">bintang (1 sampai 5)</span><button class="x" data-a="dt" data-i="'+i+'">Hapus</button></div></div>').join('')+'<button class="btn btn-ghost sm" data-a="at">+ Testimoni</button><p class="editor-note">Isi hanya testimoni asli dari pelanggan.</p>'
  +'<div class="esec">Syarat dan ketentuan (satu per baris)</div><textarea data-k="terms">'+esc(S.terms.join('\n'))+'</textarea>'
  +'<div class="editor-actions"><button class="btn btn-primary" data-a="ap2">Terapkan perubahan</button>'+(inClaude()?(owner?'<button class="btn btn-ghost" data-a="pub">Simpan dan terbitkan</button>':''):'<button class="btn btn-ghost" data-a="dl">Download index.html</button>')+'</div><p class="editor-note" id="st"></p>'
  +'<p class="editor-note">'+(inClaude()?'Simpan dan terbitkan akan memperbarui halaman ini untuk semua orang.':'Perubahan baru terlihat pelanggan setelah file index.html hasil download kamu unggah ulang ke Netlify.')+'</p></div></div>';
  const np=document.querySelector('.editor-panel');if(np)np.scrollTop=sc;
}
function shrink(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(f)})}
function buildDoc(){
  const E='<'+'/script>',data=JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#08170f"><title>'+esc(S.brand)+' - Daftar Harga Jasa Desain Grafis</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="'+FONT_HREF+'" rel="stylesheet"><style id="style">'+$('#style').textContent+'</style></head><body><div id="root"></div><div id="ed"></div><div id="rv"></div><div id="lb"></div><script type="application/json" id="data">'+data+E+'<script id="app">'+$('#app').textContent+E+'</body></html>';
}
function dl(){S.updated=today();const b=new Blob([buildDoc()],{type:'text/html;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(u),800)}
async function pub(){const st=$('#st');st.textContent='Menyimpan…';try{S.updated=today();const A=await window.claude.use('artifact');await A.publish(buildDoc())}catch(e){st.textContent=e&&e.code==='conflict'?'Ada versi baru, muat ulang halaman.':'Gagal menyimpan, coba lagi.'}}
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;
  if(k==='terms'){S.terms=e.target.value.split('\n').map(t=>t.trim()).filter(Boolean);return}
  const a=k.split('.');let o=S;for(let x=0;x<a.length-1;x++)o=o[a[x]];
  o[a[a.length-1]]=e.target.type==='checkbox'?e.target.checked:e.target.type==='number'?Math.max(0,Number(e.target.value)||0):e.target.value});
document.addEventListener('change',async e=>{
  if(e.target.classList&&e.target.classList.contains('wfa')){const w=S.works[+e.target.dataset.wi];if(!w)return;const im=wimgs(w);
    for(const f of [...e.target.files]){if(im.length>=8)break;const d=await shrink(f);if(d)im.push(d)}
    w.imgs=im;delete w.img;drawEd();return}
  if(e.target.classList&&e.target.classList.contains('wfv')){const w=S.works[+e.target.dataset.wi],f=e.target.files[0],nt=$('#vnote');if(!w||!f)return;
    if(f.size>6*1048576){if(nt)nt.textContent='Video terlalu besar ('+(f.size/1048576).toFixed(1)+' MB). Maksimal 6 MB. Kompres dulu, atau pakai kolom link video.';return}
    if(wvids(w).length>=2){if(nt)nt.textContent='Maksimal 2 video per karya.';return}
    let d=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r(null);fr.readAsDataURL(f)});
    if(d){if(!/^data:video\//.test(d))d=d.replace(/^data:[^;]*;/,'data:video/mp4;');w.vids=wvids(w);w.vids.push(d)}
    drawEd();return}
  if(e.target.id!=='wf')return;
  for(const f of [...e.target.files]){if(S.works.length>=12)break;const d=await shrink(f);if(d)S.works.push({imgs:[d],title:f.name.replace(/\.[^.]+$/,'').slice(0,40),cat:'Social Media'})}
  drawEd()});
document.addEventListener('click',e=>{
  const rb=e.target.closest('[data-a]');
  if(rb){const x=rb.dataset.a;
    if(x==='fo'){const fi=+rb.dataset.i;
      if(matchMedia('(prefers-reduced-motion:reduce)').matches){openFolder(fi,0);return}
      if(rb.classList.contains('opening'))return;rb.classList.add('opening');setTimeout(()=>{openFolder(fi,0);rb.classList.remove('opening')},760);return}
    if(x==='lbc'){closeLb();return}
    if(x==='lbx'){if(e.target===rb)closeLb();return}
    if(x==='lbp'){lbStep(-1);return}
    if(x==='lbn'){lbStep(1);return}
    if(x==='lbt'){const k=+rb.dataset.n;showSlide(k,k>lb.i?1:-1);return}
    if(x==='rvo'){e.preventDefault();openRev();return}
    if(x==='rvc'){closeRev();return}
    if(x==='rvx'){if(e.target===rb)closeRev();return}
    if(x==='st'){rrate=+rb.dataset.n;document.querySelectorAll('#stp button').forEach(y=>y.classList.toggle('on',+y.dataset.n<=rrate));return}
    if(x==='rvs'){sendRev();return}}
  const f=e.target.closest('[data-f]');if(f){filt=f.dataset.f;drawWorks();return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
  if(a==='op'){snap=JSON.stringify(S);drawEd();return}
  if(a==='cl'){S=JSON.parse(snap);$('#ed').innerHTML='';return}
  if(a==='ap2'){$('#ed').innerHTML='';render();window.scrollTo(0,0);return}
  if(a==='dl'){dl();return}
  if(a==='pub'){pub();return}
  if(a==='di')S.cats[i].items.splice(j,1);
  else if(a==='ai')S.cats[i].items.push({n:'Layanan baru',p:0});
  else if(a==='dc'){if(!confirm('Hapus kategori ini beserta isinya?'))return;S.cats.splice(i,1)}
  else if(a==='ac')S.cats.push({name:'Kategori baru',items:[{n:'Layanan baru',p:0}]});
  else if(a==='dp')S.pkgs.splice(i,1);
  else if(a==='ap')S.pkgs.push({n:'Paket baru',inc:'Isi paket',p:0});
  else if(a==='dw')S.works.splice(i,1);
  else if(a==='aw')S.works.push({imgs:[],title:'Karya video',cat:'Video'});
  else if(a==='dvv'){const w=S.works[i],v=wvids(w);v.splice(+b.dataset.n,1);w.vids=v}
  else if(a==='dwi'){const w=S.works[i],im=wimgs(w);im.splice(+b.dataset.n,1);if(!im.length)S.works.splice(i,1);else{w.imgs=im;delete w.img}}
  else if(a==='cov'){const w=S.works[i],im=wimgs(w),c=im.splice(+b.dataset.n,1)[0];im.unshift(c);w.imgs=im;delete w.img}
  else if(a==='pr'){const tx=($('#pr')||{}).value||'';const p=parseRev(tx);if(!tx.trim()||!(p.text||p.name)){const n=$('#prn');if(n)n.textContent='Pesan belum dikenali. Pastikan ada baris Nama, Layanan, Rating, dan Komentar.';return}S.testi=S.testi||[];S.testi.push(p)}
  else if(a==='at'){S.testi=S.testi||[];S.testi.push({name:'',biz:'',text:'',r:5})}
  else if(a==='dt')S.testi.splice(i,1);
  drawEd();
});

render();if(location.hash==='#review')openRev();
(async()=>{try{const u=await window.claude.use('user');if(u&&((await u.isOwner())||(await u.canEdit()))){owner=true;showTog()}}catch(e){}})();
